apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: logging-system
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'homelab-dashboards'
        orgId: 1
        folder: 'Homelab Infrastructure'
        folderUid: 'homelab-infra'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
