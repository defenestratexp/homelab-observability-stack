apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: logging-system
  labels:
    app: vector
spec:
  type: NodePort
  ports:
    - port: 514
      targetPort: 514
      nodePort: 31514
      protocol: UDP
      name: syslog-udp
    - port: 8686
      targetPort: 8686
      protocol: TCP
      name: api
  selector:
    app: vector
