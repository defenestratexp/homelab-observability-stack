# Helm values for prometheus-blackbox-exporter on k3s-main.
# Phase 2b of the homelab monitoring deployment — synthetic checks for
# public-facing and internal-LAN HTTPS services.
#
# Released as `blackbox` in the monitoring namespace. Service URL:
#   blackbox-exporter.monitoring:9115 (fullnameOverride below)
# Probes (Probe CRDs) reference this URL.

fullnameOverride: blackbox-exporter

replicaCount: 1

resources:
  requests:
    cpu: 20m
    memory: 30Mi
  limits:
    memory: 100Mi

# Modules used by Probes. http_2xx for public-facing endpoints (real LE certs);
# http_2xx_no_tls_verify for internal *.home.example.com which also has
# real LE certs but the cert chain may not be in this pod's CA store.
# tcp_connect for raw TCP probes (Postgres on db-host).
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_status_codes: []  # default 2xx
        method: GET
        follow_redirects: true
        preferred_ip_protocol: ip4

    http_2xx_no_tls_verify:
      prober: http
      timeout: 10s
      http:
        valid_status_codes: []
        method: GET
        follow_redirects: true
        tls_config:
          insecure_skip_verify: true
        preferred_ip_protocol: ip4

    tcp_connect:
      prober: tcp
      timeout: 5s

# ServiceMonitor scraped by Prometheus auto-discovers via labels.
# Disabled here because we use Probe CRDs which the operator turns into
# scrape configs targeting this exporter's endpoint directly.
serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false  # rules live in our prometheus-rules/ dir

# We don't need the chart's bundled PSP/podSecurityPolicy work.
podSecurityPolicy:
  enabled: false
